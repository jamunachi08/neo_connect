[project]
name = "neo_connect"
authors = [{ name = "Your Company", email = "it@yourcompany.com" }]
description = "NeoConnect: configurable inbound/outbound API gateway connecting e-commerce platforms and partners to ERPNext"
requires-python = ">=3.10"
readme = "README.md"
dynamic = ["version"]
dependencies = []

[build-system]
requires = ["flit_core >=3.4,<4"]
build-backend = "flit_core.buildapi"

[tool.bench.frappe-dependencies]
frappe = ">=15.0.0,<17.0.0"
erpnext = ">=15.0.0,<17.0.0"
